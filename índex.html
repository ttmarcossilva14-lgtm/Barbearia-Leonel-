<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbearia Leonel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#111;color:#fff;display:flex;justify-content:center;padding:15px}
.card{background:#1e1e1e;width:100%;max-width:420px;border-radius:20px;padding:22px}
h1{text-align:center}.sub{text-align:center;color:#aaa;font-size:13px;margin:5px 0 20px}
label{display:block;margin:15px 0 6px;color:#c9a86a;font-weight:bold;font-size:13px}
input{width:100%;padding:14px;border-radius:10px;border:none;background:#2a2a2a;color:#fff;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.hora{background:#2a2a2a;border:1px solid #333;padding:10px;border-radius:8px;text-align:center}
.hora.sel{background:#c9a86a;color:#000;font-weight:bold}
#aviso{background:#252525;padding:10px;border-radius:8px;text-align:center;color:#888;font-size:12px;margin-top:12px}
.btn{width:100%;background:#25D366;color:#fff;border:none;padding:16px;border-radius:12px;font-size:17px;font-weight:bold;margin-top:20px}
.btn:disabled{opacity:.3}
</style>
</head>
<body>
<div class="card">
<h1>💈 Barbearia Leonel</h1>
<p class="sub">Seg a Sex • 9h às 19h • Almoço 11h-12h</p>
<label>Seu nome</label><input id="nome" placeholder="Ex: João">
<label>Escolha o dia</label><input type="date" id="data">
<label>Escolha o horário</label><div id="horarios" class="grid"></div>
<div id="aviso">Escolha um dia de segunda a sexta</div>
<button id="btn" class="btn" disabled>Agendar no WhatsApp</button>
</div>
<script>
const NUMERO="5543999999999";
const HORAS=["09:00","09:30","10:00","10:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30"];
let escolhido="";const data=document.getElementById("data"),lista=document.getElementById("horarios"),aviso=document.getElementById("aviso"),btn=document.getElementById("btn"),nome=document.getElementById("nome");
data.min=new Date().toISOString().split("T")[0];
data.addEventListener("change",()=>{const d=new Date(data.value+"T12:00:00");if(d.getDay()==0||d.getDay()==6){aviso.innerText="⛔ Fechado fim de semana";lista.innerHTML="";return;}aviso.innerText="✅ Almoço 11h-12h bloqueado";lista.innerHTML="";escolhido="";btn.disabled=true;HORAS.forEach(h=>{let div=document.createElement("div");div.className="hora";div.innerText=h;div.onclick=()=>{document.querySelectorAll(".hora").forEach(e=>e.classList.remove("sel"));div.classList.add("sel");escolhido=h;if(nome.value.length>2)btn.disabled=false;};lista.appendChild(div);});});
nome.addEventListener("input",()=>{if(nome.value.length>2&&escolhido)btn.disabled=false;else btn.disabled=true;});
btn.addEventListener("click",()=>{const df=new Date(data.value+"T12:00:00").toLocaleDateString("pt-BR");const msg=`Olá! Quero agendar na Barbearia:%0A*Nome:* ${nome.value}%0A*Data:* ${df}%0A*Horário:* ${escolhido}`;window.open("https://wa.me/"+NUMERO+"?text="+msg,"_blank");});
</script>
</body>
</html>
