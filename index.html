<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barbearia Leonel - 24h</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#0f0f0f;color:#fff;padding-bottom:30px}.topo{background:#1a1a1a;padding:20px;text-align:center;border-bottom:2px solid #c9a227}.topo h1{margin:0;font-size:24px}.topo h1 span{color:#c9a227}.sub{color:#aaa;font-size:13px;margin-top:5px}.card{background:#1e1e1e;margin:12px;border-radius:16px;padding:14px;border:1px solid #2a2a2a}.label{color:#c9a227;font-weight:bold;font-size:14px;margin-top:14px;display:block}.label:first-child{margin-top:0}.servicos{display:grid;gap:10px;margin-top:8px}.serv{padding:14px;border-radius:12px;border:2px solid #333;display:flex;justify-content:space-between;cursor:pointer;background:#111}.serv.on{border-color:#c9a227;background:#332a00}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.cel{padding:10px 2px;background:#000;border:1px solid #333;border-radius:9px;text-align:center;font-size:12px;cursor:pointer}.cel.off{background:#222;color:#555;text-decoration:line-through}.cel.sel{background:#c9a227;color:#000;font-weight:bold}.dias{grid-template-columns:repeat(5,1fr)}input{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#000;color:#fff;margin-top:8px}button{width:100%;padding:16px;background:#c9a227;border:0;border-radius:12px;font-weight:bold;font-size:17px;margin-top:12px}</style></head><body><div class="topo"><h1>BARBEARIA <span>LEONEL</span></h1><div class="sub">Aberto 24h - Bloqueio automático</div></div><div class="card"><span class="label">1. Corte</span><div class="servicos"><div class="serv on" id="s1" onclick="setS('Corte Social',10,'s1')"><span>Corte Social</span><b>R$10</b></div><div class="serv" id="s2" onclick="setS('Raspada',5,'s2')"><span>Raspada</span><b>R$5</b></div><div class="serv" id="s3" onclick="setS('Moicano Neymar',10,'s3')"><span>Moicano Neymar</span><b>R$10</b></div></div><span class="label">2. Dia (Setembro)</span><div class="grid dias" id="gDias"></div><span class="label">3. Horarios 24h</span><div class="grid" id="gHoras"></div><span class="label">4. Seus dados</span><input id="nome" placeholder="Seu nome"><input id="zap" placeholder="WhatsApp"><div id="resumo" style="margin-top:12px;padding:12px;border:1px dashed #c9a227;border-radius:10px;text-align:center">Escolha dia e hora</div><button onclick="agendar()">AGENDAR AGORA</button><div id="lista" style="margin-top:12px;font-size:11px;color:#aaa"></div></div><script>let corte='Corte Social',preco=10,dia=null,hora=null;let dados=JSON.parse(localStorage.getItem('barba24h')||'{}');function setS(n,p,id){corte=n;preco=p;document.querySelectorAll('.serv').forEach(e=>e.classList.remove('on'));document.getElementById(id).classList.add('on');upd()}function upd(){document.getElementById('resumo').innerHTML=corte+' - R$'+preco+(dia?' - '+dia:'')+(hora?' as '+hora:'')}function montaDias(){let c=document.getElementById('gDias');c.innerHTML='';for(let i=8;i<=30;i++){let k='2026-09-'+String(i).padStart(2,'0');let d=document.createElement('div');d.className='cel'+(i==8?' sel':'');d.innerText=i+'/09';d.onclick=()=>{document.querySelectorAll('#gDias.cel').forEach(e=>e.classList.remove('sel'));d.classList.add('sel');dia=k;hora=null;montaHoras();upd()};c.appendChild(d);if(i==8)dia=k}}function montaHoras(){let c=document.getElementById('gHoras');c.innerHTML='';for(let h=0;h<24;h++){['00','30'].forEach(m=>{let hr=h+':'+m;let oc=dados[dia]&&dados[dia][hr];let div=document.createElement('div');div.className='cel '+(oc?'off':'');div.innerText=hr+(oc?' X':'');if(!oc){div.onclick=()=>{document.querySelectorAll('#gHoras.cel').forEach(e=>e.classList.remove('sel'));div.classList.add('sel');hora=hr;upd()}}c.appendChild(div)}); }let ag=dados[dia]||{};let ks=Object.keys(ag);document.getElementById('lista').innerHTML=ks.length?'<b>Ocupados:</b><br>'+ks.map(k=>k+' - '+ag[k].n).join('<br>'):''}function agendar(){let n=document.getElementById('nome').value;if(!dia||!hora||!n){alert('Escolha dia, hora e nome');return}if(dados[dia]&&dados[dia][hora]){alert('Ocupado!');return}if(!dados[dia])dados[dia]={};dados[dia][hora]={n:n,c:corte,p:preco};localStorage.setItem('barba24h',JSON.stringify(dados));alert('Agendado '+dia+' as '+hora);montaHoras()}montaDias();montaHoras();upd()</script></body></html>
